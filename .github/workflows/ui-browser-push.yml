# Browser proof for the code that actually landed on the shared branch.
#
# Two pull requests can each be green against the same base and still break the
# interface once merged sequentially; only the merged commit proves otherwise.
# This trigger therefore carries NO path filter — a Makefile-, `Ouroboros.spec`-
# or requirements-only push reaches the lane too, and `ci.yml` keeps its narrower
# path filter for every other job. The documentation-only skip is decided inside
# the shared lane from the event diff, not here.
#
# No schedule and no new cron. This UI-only manual entry can select one diagnostic;
# existing full manual/tag checks in ci.yml call the same reusable job unchanged.
# A red run here reports the branch state; it does not block merges by itself.
name: UI browser (ouroboros push)
run-name: ${{ inputs.diagnostic && inputs.diagnostic != 'full' && format('PARTIAL DIAGNOSTIC UI - {0}', inputs.diagnostic) || 'UI browser full lane' }}

on:
  push:
    branches: [ouroboros]
  workflow_dispatch:
    inputs:
      diagnostic:
        description: Full lane or a partial UI-only diagnostic (never full-suite proof)
        type: choice
        default: full
        options:
          - full
          - viewport
          - inflight

permissions:
  contents: read

# Deliberately NO concurrency group. Each run skips browsers only when ITS OWN
# `before..sha` range is documentation-only, so a later docs-only push cannot
# vouch for an earlier code push. Cancelling in-progress runs — or replacing a
# pending one, which a group does even without `cancel-in-progress` — would let
# that docs-only tip end green while the code it follows was never exercised.
# Every push keeps its own complete lane; overlapping runs cost runner time only.

jobs:
  ui-smoke:
    name: ${{ inputs.diagnostic && inputs.diagnostic != 'full' && format('PARTIAL DIAGNOSTIC UI - {0}', inputs.diagnostic) || 'ui-smoke' }}
    uses: ./.github/workflows/ui-browser.yml
    with:
      diagnostic: ${{ inputs.diagnostic || 'full' }}
    permissions:
      contents: read
